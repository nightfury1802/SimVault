[project]
name = "simvault"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "networkx>=3.0",
    "click>=8.0",
    "numpy>=1.24",
    "mcp>=1.0",
]

[project.scripts]
simvault = "simvault.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["simvault*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
