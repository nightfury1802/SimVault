[project]
name = "simvault"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=2.7.0",
    "networkx>=3.0",
    "mcp>=1.0",
    "click>=8.0",
    "numpy>=1.24.0",
    "turbovec>=0.1.0",
    "rank-bm25>=0.2.2",
    "anthropic>=0.40.0",
]

[project.scripts]
simvault = "simvault.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["simvault*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
